name: sodium_mr_agr

channels:
  - conda-forge

dependencies:
  - python>=3.10
  - sigpy>=0.1.26
  - numpy
  - scipy
  - h5py>=3.0
  - matplotlib>=3.0
  - nibabel>=5.0
  - numba
  - pydantic>=2.0
  - SimpleITK>=2.0
  - pytest
  # GPU acceleration (optional; the package falls back to numpy without it).
  # Install cupy matching the local CUDA, e.g. `conda install cupy` or `pip install cupy-cuda12x`.
